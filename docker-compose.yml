version: "3.8"

services:
  frontend:
    container_name: hrsystem-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: hrsystem-frontend:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    networks:
      - hrsystem-network

networks:
  hrsystem-network:
    driver: bridge